<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой список дел</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        
        .app-container {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 350px;
        }

        input {
            width: 70%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background: #eee;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
        }

        .delete-btn:hover { background-color: #cc0000; }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>Мой список дел</h2>
        
        <input type="text" id="taskInput" placeholder="Что нужно сделать?">
        <button id="addBtn">Добавить</button>
        
        <p>Всего задач: <span id="counter">0</span></p>
        
        <ul id="taskList"></ul>
    </div>

    <script src="task4.js"></script>
</body>
</html>
